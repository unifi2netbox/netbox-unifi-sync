name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff bandit pip-audit

      - name: Lint (ruff)
        run: ruff check netbox_unifi_sync/

      - name: Security scan (bandit)
        run: bandit -r netbox_unifi_sync/ -ll

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import runpy
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          module_version = runpy.run_path("netbox_unifi_sync/version.py")["__version__"]
          plugin_version = re.search(r"release:\s*(\S+)", Path("netbox-plugin.yaml").read_text()).group(1)
          if not (tag == f"v{version}" and version == module_version == plugin_version):
              raise SystemExit("Release tag and all three package version files must match")
          PY

      - name: Build and validate package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for $tag already exists. Skipping create."
            exit 0
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          section = re.search(
              r"(?ms)^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## |\Z)",
              Path("CHANGELOG.md").read_text(),
          )
          if section is None:
              raise SystemExit("Release version is missing from CHANGELOG.md")
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(section.group(1).strip() + "\n")
          PY

          cmd=(gh release create "$tag" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$tag" == *-* ]]; then
            cmd+=(--prerelease)
          fi
          "${cmd[@]}"
